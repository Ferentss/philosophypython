{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b0f">
    <title>{% block title %}Philosophy.{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% include "includes/navbar.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <div>
                <a href="{% url 'content:home' %}" class="footer-brand">Philosophy.</a>
                <p>Освітній простір думки, історії та сенсу.</p>
            </div>

            <div class="footer-links">
                <a href="{% url 'content:home' %}#epochs">Епохи</a>
                <a href="{% url 'content:home' %}#philosophers">Мислителі</a>
                <a href="{% url 'content:course_list' %}">Курси</a>
            </div>

            <span class="footer-copy">© 2026 Philosophy.</span>
        </div>
    </footer>
</body>
</html>
