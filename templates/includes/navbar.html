
{% load static %}

<header class="site-header">
    <div class="container">
        <nav class="main-navigation" aria-label="Головна навігація">

            <a class="site-logo" href="{% url 'content:home' %}">
                Philosophy<span>.</span>
            </a>

            <div class="navigation-links">
                <a href="{% url 'content:home' %}">
                    Головна
                </a>

                <a href="{% url 'content:home' %}#epochs">
                    Епохи
                </a>

                <a href="{% url 'content:home' %}#philosophers">
                    Мислителі
                </a>

                <a href="{% url 'content:course_list' %}">
                    Курси
                </a>
            </div>

            <div class="navigation-account">
                {% if user.is_authenticated %}

                    <span class="user-name">
                        {{ user.username }}
                    </span>

                    {% if user.is_superuser or user.is_teacher %}
                        <a class="outline-link"
                           href="{% url 'content:course_create' %}">
                            + Новий курс
                        </a>
                    {% endif %}

                    {% if user.is_staff %}
                        <a class="outline-link"
                           href="{% url 'admin:index' %}">
                            Адмінпанель
                        </a>
                    {% endif %}

                {% else %}

                    <a class="outline-link"
                       href="{% url 'admin:login' %}">
                        Увійти
                    </a>

                {% endif %}
            </div>

        </nav>
    </div>
</header>
