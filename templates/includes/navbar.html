
{% load static %}

<header class="site-header">
    <div class="container">
        <nav class="main-navigation" aria-label="Головна навігація">

            <a class="site-logo" href="{% url 'content:home' %}">
                Philosophy<span>.</span>
            </a>

            <div class="navigation-links">
                <a href="{% url 'content:home' %}">
                    Головна
                </a>

                <a href="{% url 'content:home' %}#epochs">
                    Епохи
                </a>

                <a href="{% url 'content:home' %}#philosophers">
                    Мислителі
                </a>

                <a href="{% url 'content:course_list' %}">
                    Курси
                </a>
            </div>

            <div class="navigation-account">

                {% if user.is_authenticated %}

                    <a class="user-name"
                       href="{% url 'users:dashboard' %}">
                        {{ user.username }}
                    </a>

                    {% if user.is_teacher or user.is_superuser %}
                        <a class="outline-link"
                           href="{% url 'content:course_create' %}">
                            + Новий курс
                        </a>
                    {% endif %}

                    {% if user.is_superuser %}
                        <a class="outline-link"
                           href="{% url 'admin:index' %}">
                            Адмінпанель
                        </a>
                    {% endif %}

                    <form method="post"
                          action="{% url 'users:logout' %}"
                          style="display: inline-flex; margin: 0;">

                        {% csrf_token %}

                        <button type="submit"
                                class="outline-link"
                                style="background: transparent;
                                       color: inherit;
                                       font: inherit;
                                       cursor: pointer;">
                            Вийти
                        </button>

                    </form>

                {% else %}

                    <a class="outline-link"
                       href="{% url 'users:login' %}">
                        Увійти
                    </a>

                    <a class="outline-link"
                       href="{% url 'users:register' %}">
                        Реєстрація
                    </a>

                {% endif %}

            </div>

        </nav>
    </div>
</header>
